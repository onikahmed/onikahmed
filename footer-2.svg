<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Build what you want to use. Share what you love.</title>
  <desc id="d">Onik Ahmed's motto on a glass panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#150d30"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#7aa2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c39bff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8bd"/>
      <stop offset="0.5" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#c39bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fe9df" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5ec8bd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="150" rx="24"/></clipPath>
    <clipPath id="panel"><rect x="48" y="18" width="1104" height="114" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .scan { animation: scan 8s linear infinite; }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(1700px); } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; display: none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle cx="1020" cy="140" r="200" fill="url(#orb)"/>
    <rect x="48" y="18" width="1104" height="114" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="url(#edge)" stroke-width="1.5"/>
    <g clip-path="url(#panel)">
      <path d="M48 18H1152V68C880 52 620 88 48 64Z" fill="url(#gloss)"/>
      <rect class="scan" x="-300" y="18" width="260" height="114" fill="url(#scanGrad)"/>
    </g>
    <text class="mono" x="600" y="76" text-anchor="middle" font-size="22" fill="url(#neon)" filter="url(#glow)">Build what you want to use. Share what you love.</text>
    <text class="mono" x="600" y="106" text-anchor="middle" font-size="14" fill="#7d8aa8">Onik Ahmed, Los Angeles</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
