<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#1a0f3d"/>
      <stop offset="100%" stop-color="#06323a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00F5FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="16" fill="url(#grid)"/>

  <!-- glow orbs -->
  <circle cx="880" cy="30" r="100" fill="#B026FF" opacity="0.14"/>
  <circle cx="110" cy="200" r="110" fill="#00F5FF" opacity="0.10"/>

  <!-- circuit lines left -->
  <g stroke="#00F5FF" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M40 110 H180 L210 80 H300"/>
    <path d="M40 140 H150 L180 170 H260"/>
  </g>
  <g fill="#00F5FF">
    <circle cx="300" cy="80" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="170" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- circuit lines right -->
  <g stroke="#B026FF" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M960 110 H820 L790 80 H700"/>
    <path d="M960 140 H850 L820 170 H740"/>
  </g>
  <g fill="#B026FF">
    <circle cx="700" cy="80" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="170" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="500" y="105" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="60" font-weight="700" letter-spacing="12" fill="url(#txt)" filter="url(#glow)">ONIK AHMED</text>
  <text x="500" y="152" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="28" font-weight="600" letter-spacing="14" fill="url(#txt)" filter="url(#glow)">RESEARCHER</text>
  <rect x="400" y="172" width="200" height="2" fill="url(#txt)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
