<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5ec8bd" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#c39bff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c39bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8bd"/>
      <stop offset="1" stop-color="#c39bff"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bar"><rect x="0" y="12" width="1200" height="4"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(1500px); } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; display: none; } }
  </style>
  <rect x="0" y="13" width="1200" height="2" fill="url(#line)" filter="url(#glow)"/>
  <g clip-path="url(#bar)">
    <rect class="shine" x="-300" y="12" width="240" height="4" fill="url(#shine)"/>
  </g>
  <path d="M600 5L609 14L600 23L591 14Z" fill="url(#gem)" filter="url(#glow)"/>
  <path d="M600 5L609 14L591 14Z" fill="#ffffff" fill-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
