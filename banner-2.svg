<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Onik Ahmed</title>
  <desc id="d">Onik Ahmed, researcher in AI, machine learning and NLP, based in Los Angeles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#150d30"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#5ec8bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8bd"/>
      <stop offset="0.5" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#c39bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#7aa2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c39bff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8bd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fe9df" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5ec8bd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7aa2ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="28"/></clipPath>
    <clipPath id="panel"><rect x="48" y="36" width="1104" height="268" rx="22"/></clipPath>
    <clipPath id="sheen"><rect x="0" y="100" width="1200" height="38"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "SF Pro Display", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .line { opacity: 0; }
    .orb1 { animation: drift1 14s ease-in-out infinite; }
    .orb2 { animation: drift2 16s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .l1 { animation: cycle 12s linear infinite; }
    .l2 { animation: cycle 12s linear 4s infinite; }
    .l3 { animation: cycle 12s linear 8s infinite; }
    @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(70px, 30px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -26px); } }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(1700px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 29% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .orb1, .orb2, .scan, .pulse, .l1, .l2, .l3 { animation: none; }
      .scan { display: none; }
      .l1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="orb1" cx="170" cy="90" r="230" fill="url(#orbCyan)"/>
    <circle class="orb2" cx="1050" cy="280" r="270" fill="url(#orbViolet)"/>

    <!-- glass slab -->
    <rect x="48" y="36" width="1104" height="268" rx="22" fill="#ffffff" fill-opacity="0.035" stroke="url(#edge)" stroke-width="1.5"/>
    <g clip-path="url(#panel)">
      <path d="M48 36H1152V136C900 108 640 170 48 126Z" fill="url(#gloss)"/>
      <rect class="scan" x="-300" y="36" width="260" height="268" fill="url(#scanGrad)"/>
    </g>

    <!-- corner brackets -->
    <g fill="none" stroke="#5ec8bd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M66 76V54H88"/>
      <path d="M1134 76V54H1112"/>
      <path d="M66 264V286H88"/>
      <path d="M1134 264V286H1112"/>
    </g>

    <!-- status line -->
    <circle class="pulse" cx="104" cy="85" r="4.5" fill="#5ec8bd"/>
    <text class="mono" x="120" y="90" font-size="15" fill="#5ec8bd" fill-opacity="0.9">onik.profile is online</text>

    <!-- name with glossy sheen -->
    <text class="sans" x="600" y="170" text-anchor="middle" font-size="80" font-weight="800" letter-spacing="-1" fill="url(#neon)" filter="url(#glow)">Onik Ahmed</text>
    <text class="sans" x="600" y="170" text-anchor="middle" font-size="80" font-weight="800" letter-spacing="-1" fill="#ffffff" fill-opacity="0.22" clip-path="url(#sheen)">Onik Ahmed</text>

    <!-- role -->
    <text class="mono" x="600" y="212" text-anchor="middle" font-size="19" fill="#9fb3d9">Researcher in AI, machine learning and NLP</text>

    <!-- rotating terminal lines -->
    <g class="line l1">
      <text class="mono" x="404" y="254" font-size="20" fill="#5ec8bd">&gt;</text>
      <text class="mono" x="428" y="254" font-size="20" fill="#e6edf7">Learning the basics of AI &amp; ML</text>
    </g>
    <g class="line l2">
      <text class="mono" x="404" y="254" font-size="20" fill="#5ec8bd">&gt;</text>
      <text class="mono" x="428" y="254" font-size="20" fill="#e6edf7">Build what you want to use.</text>
    </g>
    <g class="line l3">
      <text class="mono" x="404" y="254" font-size="20" fill="#5ec8bd">&gt;</text>
      <text class="mono" x="428" y="254" font-size="20" fill="#e6edf7">Share what you love.</text>
    </g>

    <!-- location -->
    <text class="mono" x="100" y="287" font-size="14" fill="#7d8aa8">Los Angeles, California</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
